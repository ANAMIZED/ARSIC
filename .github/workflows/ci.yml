name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Extract original ARSIC artifacts
        run: |
          set -euo pipefail
          if [ -f arsic.zip ]; then
            echo "Extracting original arsic.zip (full artifacts, no omissions)"
            rm -rf _arsic_src
            mkdir -p _arsic_src
            unzip -q arsic.zip -d _arsic_src
            # ZIP contains top-level arsic/ directory
            if [ -d _arsic_src/arsic ]; then
              SRC=_arsic_src/arsic
            else
              SRC=_arsic_src
            fi
            echo "Source root: $SRC"
            ls -la "$SRC"
            # Prefer extracted tree for tests and package
            export ARSIC_SRC="$SRC"
            echo "ARSIC_SRC=$ARSIC_SRC" >> "$GITHUB_ENV"
          else
            echo "No arsic.zip — using repo root"
            echo "ARSIC_SRC=." >> "$GITHUB_ENV"
          fi

      - name: Run core test suite (stdlib only)
        run: |
          set -euo pipefail
          cd "${ARSIC_SRC}"
          if [ ! -d tests ]; then
            echo "::error::tests/ missing after extract"
            exit 1
          fi
          export PYTHONPATH="${PYTHONPATH:-}:$(pwd)"
          python -m unittest discover -s tests -v

      - name: Smoke demo (short)
        run: |
          set -euo pipefail
          cd "${ARSIC_SRC}"
          if [ ! -d arsic ] || [ ! -f arsic/__main__.py ]; then
            echo "::warning::arsic package incomplete — skipping smoke demo"
            exit 0
          fi
          python -m arsic demo --root /tmp/arsic_ci_run --days 2 --seed 7 || true
          python -m arsic verify --root /tmp/arsic_ci_run || true
